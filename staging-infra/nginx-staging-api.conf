# ==============================================================================
# VP52 Staging Reverse Proxy Configuration
# Target Hostname: staging-api.vp52coin.com
# Upstream Service: Isolated Staging Node.js Backend on 127.0.0.1:5001
# ==============================================================================

# Custom log format redacting sensitive query parameters (signatures, tokens)
log_format staging_ssv_safe '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri HTTP/$server_version" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" $request_time';

# ------------------------------------------------------------------------------
# 1. HTTP to HTTPS Redirection (Port 80 -> Port 443)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name staging-api.vp52coin.com;

    # Allow Let's Encrypt ACME challenge validation over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Dedicated Staging HTTPS Server (Port 443)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-api.vp52coin.com;

    # Reject unexpected host headers (prevents HTTP Host header attacks)
    if ($host != "staging-api.vp52coin.com") {
        return 400 "Invalid Host Header";
    }

    # TLS Certificates (Let's Encrypt / Certbot path)
    ssl_certificate /etc/letsencrypt/live/staging-api.vp52coin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.vp52coin.com/privkey.pem;

    # Strong TLS Security Protocols & Ciphers (TLS 1.2 / TLS 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:StagingSSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Request size limits (mobile photo uploads up to 15MB)
    client_max_body_size 15m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Logging
    access_log /var/log/nginx/staging_api_access.log staging_ssv_safe;
    error_log /var/log/nginx/staging_api_error.log warn;

    # --------------------------------------------------------------------------
    # Block Sensitive Files & Paths
    # --------------------------------------------------------------------------
    # Block access to database files
    location ~* \.(db|sqlite|sqlite3|db-wal|db-shm)$ {
        deny all;
        return 404;
    }

    # Block access to environment and hidden files
    location ~* (^|/)\.(?!well-known) {
        deny all;
        return 404;
    }

    # --------------------------------------------------------------------------
    # Static Uploads Directory (Isolated Staging Uploads)
    # --------------------------------------------------------------------------
    location /uploads/ {
        alias /var/www/vp52-staging/server/public/staging_uploads/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Public Staging Health Check Endpoint
    # --------------------------------------------------------------------------
    location = /api/health {
        proxy_pass http://127.0.0.1:5001/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Public Google AdMob SSV Callback Endpoints
    # CRITICAL: Do NOT rewrite, decode, normalize, or reorder query parameters!
    # Using 'proxy_pass http://127.0.0.1:5001;' (without URI component) ensures
    # Nginx forwards the exact, pristine, byte-identical $request_uri and query string.
    # --------------------------------------------------------------------------
    location /api/admob/ssv {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffer & Timeout Configurations for Google Callbacks
        proxy_connect_timeout 10s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_buffering off;
    }

    # Alias for AdMob console compatibility
    location /api/admob/ssv-callback {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Staging API Gateway (All other /api/ routes)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support if needed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Fallback for unrecognized routes
    location / {
        return 404 "VP52 Staging API Gateway - Resource Not Found\n";
    }
}
